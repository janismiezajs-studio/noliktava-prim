<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<title>NoliktavaPRIM</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PRIM">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#14407a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#17202b;--mut:#5b6775;--line:#d9dee5;--pri:#14407a;--ok:#1b9e4b;--okd:#14803b;--warn:#b26a00;--warnbg:#fff4de;--err:#b3261e;--errbg:#fdeceb;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--pri);color:#fff}
header h1{font-size:19px;margin:0;flex:1}
header .back{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:16px}
.chip{border:0;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;background:#fff;color:var(--pri)}
.chip.admin{background:#ffd34d;color:#4a3500}
main{padding:14px;max-width:640px;margin:0 auto}
footer{padding:14px;text-align:center;color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:17px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{display:block;width:100%;min-height:64px;border:0;border-radius:var(--r);background:var(--pri);color:#fff;font-size:18px;font-weight:600;padding:12px;text-align:center}
.big.sec{background:#fff;color:var(--pri);border:2px solid var(--pri)}
.big.ok{background:var(--ok);min-height:68px;font-size:20px;letter-spacing:.3px}
.big.ok:active{background:var(--okd)}
.big:disabled{background:#b9c0c9;color:#fff;border-color:#b9c0c9}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;font-size:16px;color:var(--ink)}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.dng{color:var(--err);border-color:var(--err)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:0 0 auto}.row>.grow{flex:1 1 0;min-width:0}
input[type=text],input[type=password],input[type=search],select,textarea{width:100%;font-size:18px;padding:12px;border:1px solid #b8c0ca;border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:15px}
label{display:block;font-weight:600;margin:10px 0 4px}
.mut{color:var(--mut);font-size:14px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#e7edf5;color:var(--pri)}
.pill.exp{background:#e3f3e8;color:var(--okd)}.pill.warn{background:var(--warnbg);color:var(--warn)}
.alert{border-radius:12px;padding:12px;margin:10px 0}
.alert.warn{background:var(--warnbg);color:#5a3800;border:1px solid #f0cf8a}
.alert.err{background:var(--errbg);color:var(--err);border:1px solid #f1b8b4}
.alert.info{background:#e8f0fb;color:#12355f;border:1px solid #bdd0ec}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #eef1f4}
.kv:last-child{border:0}
.code{font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:700;word-break:break-all}
.qty{font-size:30px;font-weight:700}
.rec{padding:10px 0;border-bottom:1px solid #eef1f4}.rec:last-child{border:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chips .chip{background:#e7edf5}.chips .chip.on{background:var(--pri);color:#fff}
.wh{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wh button{min-height:54px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#17202b;color:#fff;padding:12px 18px;border-radius:12px;z-index:30;max-width:90%;display:none}
#toast.show{display:block}
.overlay{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column}
.overlay video{flex:1;width:100%;object-fit:cover;min-height:0}
.overlay .bar{padding:14px;background:#000;color:#fff;display:flex;gap:10px;align-items:center}
.overlay .bar .grow{flex:1}
.frame{position:absolute;left:10%;right:10%;top:28%;height:22%;border:3px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25;display:flex;align-items:center;justify-content:center;padding:18px}
.modal .box{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:380px}
.modal h3{margin:0 0 10px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
